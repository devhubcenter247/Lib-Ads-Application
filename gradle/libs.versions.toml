[versions]
agp = "9.1.1"
kotlin = "2.3.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.12.2"
constraintlayout = "2.2.1"
ui = "1.12.0"
material3 = "1.4.0"
androidSdpCompose ="1.3.0"
adsMobileSdk = "1.4.0"
# Ads, attribution and billing SDKs shared by gma-lib and adlib. Each mediation adapter must stay
# on the release family of the network SDK it wraps (see the adapter's POM).
ump = "4.0.0"
firebaseAnalytics = "23.2.0"
billing = "9.1.0"
adjust = "5.7.0"
appsflyer = "6.17.5"
appsflyerAdrevenue = "6.9.1"
installreferrer = "2.2"
facebookSdk = "18.2.3"
audienceNetwork = "6.21.0"
mediationFacebook = "6.21.0.3"
mediationMintegral = "17.1.61.0"
mediationPangle = "8.0.0.4.0"
unityAds = "4.19.0"
mediationUnity = "4.19.0.0"
[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "ui" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
android-sdp-ssp = { module = "com.github.dbv0610.ssp-sdp-compose:android", version.ref = "androidSdpCompose" }
ads-mobile-sdk = { group = "com.google.android.libraries.ads.mobile.sdk", name = "ads-mobile-sdk", version.ref = "adsMobileSdk" }
ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics", version.ref = "firebaseAnalytics" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
adjust-android = { group = "com.adjust.sdk", name = "adjust-android", version.ref = "adjust" }
appsflyer-sdk = { group = "com.appsflyer", name = "af-android-sdk", version.ref = "appsflyer" }
appsflyer-adrevenue = { group = "com.appsflyer", name = "adrevenue", version.ref = "appsflyerAdrevenue" }
installreferrer = { group = "com.android.installreferrer", name = "installreferrer", version.ref = "installreferrer" }
facebook-sdk = { group = "com.facebook.android", name = "facebook-android-sdk", version.ref = "facebookSdk" }
audience-network-sdk = { group = "com.facebook.android", name = "audience-network-sdk", version.ref = "audienceNetwork" }
mediation-facebook = { group = "com.google.ads.mediation", name = "facebook", version.ref = "mediationFacebook" }
mediation-mintegral = { group = "com.google.ads.mediation", name = "mintegral", version.ref = "mediationMintegral" }
mediation-pangle = { group = "com.google.ads.mediation", name = "pangle", version.ref = "mediationPangle" }
unity-ads = { group = "com.unity3d.ads", name = "unity-ads", version.ref = "unityAds" }
mediation-unity = { group = "com.google.ads.mediation", name = "unity", version.ref = "mediationUnity" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
